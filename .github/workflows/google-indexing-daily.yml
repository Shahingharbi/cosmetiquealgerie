name: Google Indexing API — Daily Submit

on:
  # Les 200 soumissions quotidiennes de l'Indexing API sont un quota du PROJET Google
  # Cloud, pas du site. Le compte indexing-bot (projet seo-indexing-495516) sert aussi
  # le site de parfum maisonnumidia, dont le robot passe chaque jour (cron 09:00 UTC,
  # lancé en pratique par GitHub entre 14h et 19h UTC).
  #
  # Règle du propriétaire (16/10/2026) : maisonnumidia est prioritaire QUAND IL EST EN
  # LIGNE. Le 16/10 il a été coupé par Vercel (plan Hobby dépassé) : son robot échoue
  # sans rien consommer, les 200 envois reviennent à cosmetiquealgerie. L'étape
  # « priorite » ci-dessous vérifie maisonnumidia à chaque passage : s'il répond 200,
  # ce robot-ci n'envoie rien et lui laisse le quota. Aucune intervention à prévoir
  # quand il reviendra en ligne.
  schedule:
    # 10:00 UTC demandé ; GitHub le décale souvent de plusieurs heures.
    - cron: "0 10 * * *"
  workflow_dispatch:
    # Manual trigger from GitHub UI
    inputs:
      limit:
        description: "Max URLs to submit (default 200)"
        required: false
        default: "200"

# Une seule instance à la fois, imposée par GitHub. Chaque run réécrit le journal en
# entier : deux runs simultanés (le cron et un lancement manuel) s'écraseraient
# mutuellement. Le second attend la fin du premier au lieu de l'annuler — un run
# interrompu en pleine soumission perdrait sa trace.
concurrency:
  group: google-indexing
  cancel-in-progress: false

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Aligné sur .nvmrc et package.json. Node 20 est en fin de vie depuis avril 2026.
          node-version: "24"

      - name: Priorite au site de parfum s'il est en ligne
        id: priorite
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://maisonnumidia.store/ || echo 000)
          echo "maisonnumidia.store repond $code"
          if [ "$code" = "200" ]; then echo "ceder=oui" >> "$GITHUB_OUTPUT"; else echo "ceder=non" >> "$GITHUB_OUTPUT"; fi

      - name: Run Indexing API submitter
        if: steps.priorite.outputs.ceder != 'oui'
        env:
          GOOGLE_INDEXING_CREDENTIALS_JSON: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS_JSON }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          node scripts/google-indexing-api.mjs --limit=$LIMIT

      - name: Commit updated log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indexing-log.json
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "chore: indexing log update $(date -u +%Y-%m-%d)"
            git push
          fi
