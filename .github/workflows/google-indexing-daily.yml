name: Google Indexing API — Daily Submit

on:
  # ⏸ PASSAGE AUTOMATIQUE DÉSACTIVÉ — en attente d'un projet Google Cloud dédié.
  #
  # Les 200 soumissions quotidiennes de l'Indexing API sont un quota du PROJET Google
  # Cloud, pas du site. Le compte indexing-bot (projet seo-indexing-495516) sert aussi
  # le site de parfum, dont le robot tourne chaque jour à 09:00 UTC et consomme ses 200.
  # Constaté le 29/09/2026 : le premier appel de ce robot-ci a reçu un 429. Laisser les
  # deux passages automatiques actifs, c'est les faire se disputer le même quota chaque
  # matin — et le second à tourner échoue.
  #
  # Décision du propriétaire : le site de parfum garde ses 200, celui-ci attend son
  # propre projet Google Cloud. Pour réactiver, une fois ce projet créé :
  #   1. remplacer le secret GOOGLE_INDEXING_CREDENTIALS_JSON par la clé du NOUVEAU
  #      compte de service, ajouté propriétaire de sc-domain:cosmetiquealgerie.com ;
  #   2. décommenter les trois lignes ci-dessous.
  #
  # schedule:
  #   # Every day at 10:00 UTC = 11:00 Algiers time
  #   - cron: "0 10 * * *"
  workflow_dispatch:
    # Manual trigger from GitHub UI
    inputs:
      limit:
        description: "Max URLs to submit (default 200)"
        required: false
        default: "200"

# Une seule instance à la fois, imposée par GitHub. Chaque run réécrit le journal en
# entier : deux runs simultanés (le cron et un lancement manuel) s'écraseraient
# mutuellement. Le second attend la fin du premier au lieu de l'annuler — un run
# interrompu en pleine soumission perdrait sa trace.
concurrency:
  group: google-indexing
  cancel-in-progress: false

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Aligné sur .nvmrc et package.json. Node 20 est en fin de vie depuis avril 2026.
          node-version: "24"

      - name: Run Indexing API submitter
        env:
          GOOGLE_INDEXING_CREDENTIALS_JSON: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS_JSON }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          node scripts/google-indexing-api.mjs --limit=$LIMIT

      - name: Commit updated log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indexing-log.json
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "chore: indexing log update $(date -u +%Y-%m-%d)"
            git push
          fi
